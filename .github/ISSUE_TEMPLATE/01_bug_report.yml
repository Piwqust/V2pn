name: Ошибка / Bug report
description: Что-то работает не так, как должно. Something does not work as it should.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Перед отправкой проверьте, пожалуйста:
        - у вас последняя версия V2pn (меню → «Обновления»);
        - сервер работает в другом клиенте или на другом устройстве. Если не подключается нигде, это вопрос к вашему провайдеру VPN, а не к приложению.

        **Не вставляйте ссылки подписок и адреса серверов:** в них ваш ключ доступа.

        Please check that you run the latest V2pn and that the server works elsewhere. Never paste subscription links or server addresses: they carry your access key.

  - type: input
    id: version
    attributes:
      label: Версия V2pn и система / V2pn version and OS
      description: Версия написана в окне «Обновления» (главное меню). Например «V2pn 1.0.1, Windows 11» или «V2pn 1.0.1, macOS 15, Apple silicon».
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Режим / Mode
      options:
        - Прокси (системный прокси) / Proxy
        - VPN (TUN)
        - Не знаю / Not sure
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Что вы делали / Steps
      description: По шагам, чтобы это можно было повторить.
      placeholder: |
        1. Открыл V2pn
        2. Нажал «Подключиться»
        3. ...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Что произошло и что ожидалось / What happened, what you expected
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Журнал / Log
      description: Главное меню → «Журнал». Скопируйте последние строки. Адреса серверов и ссылки замените на «***».
      render: text
    validations:
      required: false
