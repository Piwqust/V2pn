name: Предложение / Feature request
description: Чего не хватает в V2pn. What V2pn is missing.
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую задачу это решает / What problem does it solve
      description: Что вы пытались сделать и что помешало.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Как это могло бы работать / How it could work
    validations:
      required: true

  - type: textarea
    id: other
    attributes:
      label: Где это уже сделано хорошо / Where it is done well
      description: Другое приложение, снимок экрана, ссылка. Необязательно.
    validations:
      required: false
