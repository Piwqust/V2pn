name: V2pn CI

# Every push and pull request: the tests and a Release build on Windows and macOS, then the
# macOS app is packaged, started on a real Mac and photographed, because nobody on the project
# has one. The screenshot and the app's logs are attached to the run. Next to that: the
# installers' release signature check (Windows PowerShell 5.1, PowerShell 7 and a Mac's own
# LibreSSL), the hub's tests and its C# fixture, and the website's build.
on:
  push:
    branches: [v2pn]
  pull_request:
    branches: [v2pn]
  workflow_dispatch:

concurrency:
  group: v2pn-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # A hung test must not eat the month's minutes: a macOS minute counts as ten in a private repository.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # The release keys in tools/install.ps1 and install.sh are V2pnUpdateKeys, and each script's
      # signature check accepts the signed release in tools/install-test/ and refuses it changed.
      # The installers themselves do not run. Windows PowerShell 5.1 is what most people run
      # install.ps1 with; a Mac is checked with its own tools only (LibreSSL, not Homebrew's openssl).
      - name: Installers' signature check (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tools/check-install-scripts.ps1

      - name: Installers' signature check (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/check-install-scripts.ps1

      - name: Installers' signature check (macOS)
        if: runner.os == 'macOS'
        run: PATH=/usr/bin:/bin:/usr/sbin:/sbin /bin/bash tools/check-install-scripts.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test --project v2rayN/ServiceLib.Tests/ServiceLib.Tests.csproj -c Release

      - name: Build
        run: dotnet build v2rayN/v2rayN.Desktop/v2rayN.Desktop.csproj -c Release -v q -nologo

  hub:
    name: Hub tests and its C# fixture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # engines.node there
          node-version-file: hub/package.json

      - name: Test
        working-directory: hub
        run: node --test test/

      # v2rayN/ServiceLib.Tests reads hub/test/fixtures/csharp/ with V2pn's own code, so it must be
      # what the hub makes now. The generator signs with a new throwaway key at the current time and
      # ECDSA signatures are randomised: the key, the signatures and the "published" and "until"
      # lines differ on every run and are left out. Everything else must come out byte for byte.
      # A failure here means: run `node hub/test/make-csharp-fixture.mjs` and commit the result.
      - name: The C# fixture is up to date
        run: |
          node hub/test/make-csharp-fixture.mjs
          git diff --exit-code -I '"(published|until)": ' -- hub/test/fixtures/csharp \
            ':(exclude)hub/test/fixtures/csharp/hub-public-key.txt' ':(exclude)hub/test/fixtures/csharp/*.sig'
          new="$(git ls-files --others --exclude-standard -- hub/test/fixtures/csharp)"
          if [ -n "$new" ]; then
            echo "::error::The generator writes files that are not committed: $new"
            exit 1
          fi

  site:
    name: Website builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install
        run: npm ci --no-audit --no-fund

      # npm run build ends with scripts/check-build.mjs, the site's own check: it fails the build on
      # any inline script, inline handler or file from another origin that the server's CSP would block.
      - name: Build
        run: npm run build

  macos-app:
    name: macOS app starts
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Package
        env:
          V2PN_NO_CORES: 1
        run: |
          chmod +x tools/package-macos.sh
          tools/package-macos.sh 0.0.1 arm64 out

      - name: Start the app from the zip, as an update would unpack it
        run: |
          mkdir run
          ditto -x -k out/V2pn-macos-arm64.zip run
          test -x run/V2pn.app/Contents/MacOS/V2pn
          open run/V2pn.app
          sleep 30
          mkdir -p evidence
          screencapture -x evidence/macos-main-window.png || true
          if ! pgrep -x V2pn > /dev/null; then
            echo "::error::V2pn is not running 30 seconds after it was opened"
            exit 1
          fi
          echo "V2pn is running: $(pgrep -x V2pn)"

      - name: Quit the app and check it leaves nothing behind
        run: |
          osascript -e 'tell application "V2pn" to quit' || true
          for i in $(seq 1 20); do pgrep -x V2pn > /dev/null || break; sleep 1; done
          if pgrep -x V2pn > /dev/null; then
            echo "::warning::V2pn did not quit within 20 seconds"
            pkill -x V2pn || true
          fi
          networksetup -getwebproxy Ethernet 2>/dev/null || true

      - name: Collect logs
        if: always()
        run: |
          mkdir -p evidence
          cp -R "$HOME/Library/Application Support/V2pn/guiLogs" evidence/ 2>/dev/null || true
          ls -la "$HOME/Library/Application Support/V2pn" 2>/dev/null || true

      - name: Upload screenshot and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-app
          path: |
            evidence
            out/*.zip
          if-no-files-found: warn
