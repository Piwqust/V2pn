name: V2pn end to end

# Nightly and on demand: V2pn, packaged as a release packages it, gets a subscription whose servers really work
# (a local VLESS server run by the xray of tools/cores.lock.json, served by tools/demo/demo_sub.py), connects in
# Proxy mode on its own port without touching the system proxy, and carries a request through that server to a
# local HTTP server. v2pnctl drives it: no window is clicked (tools/app-check.ps1 -Connect). The screenshot, V2pn's
# logs and the demo server's output are attached to the run.
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

concurrency:
  group: v2pn-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  connect:
    name: Subscription, connect, a request through the server
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      # Its update checks go to an address where nothing answers, never to V2pn's server.
      - name: Package
        shell: pwsh
        run: ./tools/release.ps1 -Version 0.0.1 -Arch x64 -NoCores -NoInstaller -UpdateOnly -NoManifest -OutDir out -UpdateSources http://127.0.0.1:9/releases

      # The runner image's Python runs demo_sub.py; the cores come from tools/cores.lock.json, checked against its hash.
      - name: Connect and carry a request
        shell: pwsh
        run: ./tools/app-check.ps1 -From out/V2pn-windows-x64-update.zip -Work "$env:RUNNER_TEMP/app-check" -Connect

      - name: Upload screenshot and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-e2e
          path: ${{ runner.temp }}/app-check/evidence
          if-no-files-found: warn
