name: V2pn release

# Pushing a tag made by tools/release.ps1 -Tag (v1.2.3) builds the Windows and macOS packages.
# What happens next depends on where the release signing key lives:
#
#  - on your computer only (the default): the run ends with the packages attached to it. Run
#    tools/sign-release.ps1 -Version 1.2.3 there: it downloads them, signs the manifest and
#    opens the draft release. The key never leaves your machine.
#  - in the secret V2PN_SIGNING_KEY of an environment called "release" (the PEM text of the
#    key; require a reviewer there): this workflow signs and opens the draft release itself.
#
# Either way the release is a DRAFT. Look it over and press Publish: only a published release
# is what installed copies of V2pn see as the newest version.
#
# A beta tag (v1.2.3-beta.1, tools/release.ps1 -Beta -Tag) becomes a draft PRE-RELEASE: GitHub's
# "latest" never names it, so only copies with "Get beta versions" on take it, through the hub's
# beta channel (hub/lib/beta.mjs). winget, Homebrew and the mirror's "latest" skip it.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build again, e.g. v1.2.3 or v1.2.3-beta.1 (only while its release is still a draft)
        required: true
        type: string

concurrency:
  group: v2pn-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test --project v2rayN/ServiceLib.Tests/ServiceLib.Tests.csproj -c Release

      # The runner image has Inno Setup already (6.7.1 in windows-2025 of November 2026). When it
      # does not, Chocolatey installs that exact version; its package checks the installer's hash.
      - name: Inno Setup (for the installer)
        shell: pwsh
        run: |
          . ./tools/_common.ps1
          if (-not (Find-Iscc)) { choco install innosetup --version 6.7.1 --no-progress -y }

      - name: Build packages
        shell: pwsh
        run: ./tools/release.ps1 -Version $env:TAG.TrimStart('v') -Arch x64,arm64 -NoManifest -OutDir packages

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-windows
          path: packages/V2pn-*
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      # As on Windows: the macOS packages are built only from code whose tests pass on a Mac.
      - name: Test
        run: dotnet test --project v2rayN/ServiceLib.Tests/ServiceLib.Tests.csproj -c Release

      - name: Build packages
        run: |
          chmod +x tools/package-macos.sh
          tools/package-macos.sh "${TAG#v}" arm64 packages
          tools/package-macos.sh "${TAG#v}" x64 packages

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-macos
          path: packages/V2pn-*
          if-no-files-found: error

  draft:
    name: Sign and open the draft release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          path: packages
          merge-multiple: true

      - name: Refuse to touch a published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null | grep -q false; then
            echo "::error::Release $TAG is already published. Installed copies may have its packages; replacing them would break their checks. Release a new version instead."
            exit 1
          fi

      - name: Write and sign the manifest
        id: sign
        env:
          V2PN_SIGNING_KEY: ${{ secrets.V2PN_SIGNING_KEY }}
        run: |
          if [ -z "$V2PN_SIGNING_KEY" ]; then
            echo "::notice::The signing key is not stored on GitHub. Sign and open the draft from your computer: tools/sign-release.ps1 -Version ${TAG#v}"
            echo "Packages are built and attached to this run. Sign them on your computer: \`tools/sign-release.ps1 -Version ${TAG#v}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dotnet run tools/manifest.cs -- packages "${TAG#v}" --repo .
          # The one-command installers go with every release: .../releases/latest/download/install.ps1 (Windows), install.sh (macOS)
          cp tools/install.ps1 tools/install.sh packages/
          ls -la packages
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Open the draft release
        if: steps.sign.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          git tag -l --format='%(contents:body)' "$TAG" > notes.md
          [ -s notes.md ] || echo "V2pn $version" > notes.md
          # A version with a "-" part is a beta: a pre-release, which GitHub's "latest" never names.
          kind=()
          case "$version" in *-*) kind=(--prerelease) ;; esac
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" packages/* --clobber
          else
            gh release create "$TAG" packages/* --draft "${kind[@]}" --verify-tag --title "V2pn $version" --notes-file notes.md
          fi
          echo "Draft ${kind:+pre-}release $TAG is ready: check it, then press Publish." >> "$GITHUB_STEP_SUMMARY"
