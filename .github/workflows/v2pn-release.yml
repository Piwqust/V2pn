name: V2pn release

# Pushing a tag made by tools/release.ps1 -Tag (v1.2.3) builds the Windows packages and
# publishes the GitHub release that every installed V2pn checks for updates.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v1.2.3
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        shell: pwsh
        run: dotnet test --project v2rayN/ServiceLib.Tests/ServiceLib.Tests.csproj -c Release

      - name: Build packages
        shell: pwsh
        run: ./tools/release.ps1 -Version $env:TAG.TrimStart('v') -Arch x64,arm64

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:TAG.TrimStart('v')
          $notes = git tag -l --format='%(contents)' $env:TAG
          if (-not $notes) { $notes = "V2pn $version" }
          $notesFile = Join-Path $env:RUNNER_TEMP 'notes.md'
          Set-Content -Path $notesFile -Value $notes -Encoding utf8
          $files = Get-ChildItem "dist/release/$version" -File | ForEach-Object { $_.FullName }
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @files --clobber
          } else {
            gh release create $env:TAG @files --title "V2pn $version" --notes-file $notesFile --verify-tag
          }
