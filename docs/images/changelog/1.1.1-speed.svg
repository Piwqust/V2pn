<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-label="V2pn 1.1.1 against 1.1.0: start to window 3.0 s to 1.6 s; processor time in the first 90 s 9.1 s to 2.2 s; processor time to update a 1000-server subscription 6.2 s to 1.3 s. Lower is better.">
<title>V2pn 1.1.1: faster and lighter</title>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2C2D35"/><stop offset="1" stop-color="#1B1C21"/></linearGradient></defs>
<rect x="0.5" y="0.5" width="799" height="459" rx="20" fill="url(#bg)" stroke="#FFFFFF" stroke-opacity="0.12"/>
<rect x="24" y="1.5" width="752" height="1" rx="0.5" fill="#FFFFFF" fill-opacity="0.10"/>
<g font-family="'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif">
<text x="36" y="50" font-size="13" fill="#A9ABB6" letter-spacing="0.3">V2PN 1.1.1</text>
<text x="36" y="84" font-size="28" font-weight="600" fill="#FFFFFF">Faster and lighter</text>
<rect x="574" y="70" width="12" height="12" rx="3" fill="#4F76BF"/>
<text x="594" y="81" font-size="14" fill="#C9CBD3">1.1.0</text>
<rect x="669" y="70" width="12" height="12" rx="3" fill="#EE4428"/>
<text x="689" y="81" font-size="14" fill="#C9CBD3">1.1.1</text>
<rect x="36" y="108" width="728" height="1" fill="#FFFFFF" fill-opacity="0.08"/>
<text x="36" y="152" font-size="16" font-weight="600" fill="#FFFFFF">Start to window</text>
<text x="36" y="173" font-size="12.5" fill="#A9ABB6">1000 servers, median of five starts</text>
<path d="M286,136 H612.0 Q616.0,136 616.0,140 V148 Q616.0,152 612.0,152 H286 Z" fill="#4F76BF"/>
<text x="626.0" y="148.5" font-size="13.5" font-weight="400" fill="#C9CBD3">3.0 s</text>
<path d="M286,156 H458.0 Q462.0,156 462.0,160 V168 Q462.0,172 458.0,172 H286 Z" fill="#EE4428"/>
<text x="472.0" y="168.5" font-size="13.5" font-weight="600" fill="#FFFFFF">1.6 s</text>
<text x="764" y="162" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="end">1.9× faster</text>
<rect x="36" y="210" width="728" height="1" fill="#FFFFFF" fill-opacity="0.06"/>
<text x="36" y="248" font-size="16" font-weight="600" fill="#FFFFFF">Processor, first 90 s</text>
<text x="36" y="269" font-size="12.5" fill="#A9ABB6">Busy time after start, window open</text>
<path d="M286,232 H612.0 Q616.0,232 616.0,236 V244 Q616.0,248 612.0,248 H286 Z" fill="#4F76BF"/>
<text x="626.0" y="244.5" font-size="13.5" font-weight="400" fill="#C9CBD3">9.1 s</text>
<path d="M286,252 H361.7802197802198 Q365.7802197802198,252 365.7802197802198,256 V264 Q365.7802197802198,268 361.7802197802198,268 H286 Z" fill="#EE4428"/>
<text x="375.7802197802198" y="264.5" font-size="13.5" font-weight="600" fill="#FFFFFF">2.2 s</text>
<text x="764" y="258" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="end">−76%</text>
<rect x="36" y="306" width="728" height="1" fill="#FFFFFF" fill-opacity="0.06"/>
<text x="36" y="344" font-size="16" font-weight="600" fill="#FFFFFF">Processor, subscription update</text>
<text x="36" y="365" font-size="12.5" fill="#A9ABB6">1000 servers that did not change</text>
<path d="M286,328 H612.0 Q616.0,328 616.0,332 V340 Q616.0,344 612.0,344 H286 Z" fill="#4F76BF"/>
<text x="626.0" y="340.5" font-size="13.5" font-weight="400" fill="#C9CBD3">6.2 s</text>
<path d="M286,348 H351.19354838709677 Q355.19354838709677,348 355.19354838709677,352 V360 Q355.19354838709677,364 351.19354838709677,364 H286 Z" fill="#EE4428"/>
<text x="365.19354838709677" y="360.5" font-size="13.5" font-weight="600" fill="#FFFFFF">1.3 s</text>
<text x="764" y="354" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="end">−79%</text>
<text x="36" y="438" font-size="12" fill="#A9ABB6">Lower is better. Release builds of 1.1.0 and 1.1.1 on the same Windows 11 PC, a list of 1000 test servers.</text>
</g></svg>
