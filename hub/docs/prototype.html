<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Путь провайдера</title>
<style>
@font-face{font-family:Geist;src:url(fonts/Geist-Regular.woff2) format("woff2");font-weight:400}
@font-face{font-family:Geist;src:url(fonts/Geist-Medium.woff2) format("woff2");font-weight:500}
@font-face{font-family:Geist;src:url(fonts/Geist-SemiBold.woff2) format("woff2");font-weight:600}
@font-face{font-family:GeistMono;src:url(fonts/GeistMono-Regular.woff2) format("woff2")}
:root{--bg:#ECEEF3;--ink:#16161B;--muted:#5C5F6B;--card:#fff;--line:#DCDFE7;--soft:#F5F6F9;--accent:#E8391B;--ok:#167A3E;--okbg:#E3F3E8;--warn:#9A5B00;--warnbg:#FFF1D9;--bad:#B3261E;--badbg:#FDE7E5;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
code,.mono{font-family:GeistMono,ui-monospace,monospace;font-size:13px}
a{color:inherit}
/* prototype bar */
.pbar{position:sticky;top:0;z-index:20;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 20px;background:#16161B;color:#fff;font-size:13px}
.pbar b{font-weight:600;margin-right:6px}
.seg{display:inline-flex;background:#2A2A31;border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:#C9CAD2;padding:6px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed=true]{background:#fff;color:#16161B}
.pbar .hint{color:#9C9DA8;margin-left:auto}
.pbar .reset{border:1px solid #3a3a44;background:none;color:#C9CAD2;border-radius:999px;padding:6px 12px;cursor:pointer}
/* site chrome */
.site{max-width:1180px;margin:0 auto;padding:0 24px 80px}
.nav{display:flex;align-items:center;gap:28px;height:64px;border-bottom:1px solid var(--line);margin-bottom:40px}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:18px}
.fork{width:20px;height:20px;color:var(--accent)}
.nav .links{display:flex;gap:22px;color:var(--muted);font-size:14px}
.nav .me{margin-left:auto;font-size:14px;color:var(--muted)}
h1{font-size:44px;line-height:1.08;letter-spacing:-.02em;font-weight:500;margin:0 0 14px}
h2{font-size:26px;line-height:1.15;letter-spacing:-.01em;font-weight:500;margin:0 0 10px}
h3{font-size:17px;font-weight:600;margin:0 0 6px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:12px 22px;background:var(--accent);color:#111;font-weight:500;cursor:pointer;transition:transform .12s,filter .12s}
.btn:hover{filter:brightness(1.05);transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.dark{background:var(--ink);color:#fff}
.btn.sm{padding:8px 14px;font-size:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.tier{display:flex;flex-direction:column;gap:8px}
.tier .n{font-family:GeistMono;font-size:12px;color:var(--muted)}
.tier ul{margin:4px 0 0;padding-left:18px;color:var(--muted)}
.tier .need{margin-top:auto;padding-top:10px;border-top:1px solid var(--line);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:500;background:var(--soft);border:1px solid var(--line)}
.pill.ok{background:var(--okbg);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--badbg);color:var(--bad);border-color:transparent}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field span{font-size:13px;font-weight:500}
.field small{color:var(--muted);font-size:12px}
input[type=text],input[type=email],textarea,select{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--ink)}
textarea{min-height:64px;resize:vertical}
.radio{display:flex;flex-direction:column;gap:8px}
.radio label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:#fff}
.radio label:has(input:checked){border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.radio input{margin-top:4px}
.steps{display:flex;gap:6px;margin-bottom:24px;flex-wrap:wrap}
.steps span{font-size:12px;padding:4px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--muted)}
.steps span.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.steps span.done{color:var(--ok)}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.checks li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start}
.ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600}
.ic.ok{background:var(--okbg);color:var(--ok)}.ic.warn{background:var(--warnbg);color:var(--warn)}.ic.bad{background:var(--badbg);color:var(--bad)}.ic.wait{background:var(--soft);color:var(--muted)}
.layout{display:grid;grid-template-columns:220px 1fr;gap:28px}
.side{display:flex;flex-direction:column;gap:4px}
.side button{text-align:left;border:0;background:none;padding:9px 12px;border-radius:10px;cursor:pointer;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.side button[aria-current=true]{background:#fff;color:var(--ink);font-weight:500}
.side .lock{font-size:11px}
.banner{display:flex;gap:12px;align-items:center;border-radius:12px;padding:12px 16px;margin-bottom:20px;font-size:14px}
.banner.warn{background:var(--warnbg);color:#5a3a00}.banner.ok{background:var(--okbg);color:#0d4a26}.banner.info{background:#fff;border:1px solid var(--line)}
pre{background:#16161B;color:#E7E8EE;border-radius:12px;padding:14px 16px;overflow:auto;margin:0 0 12px;font-family:GeistMono;font-size:12.5px;line-height:1.55}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.copyline{display:flex;gap:8px;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.copyline code{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.swatch{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);padding:0;cursor:pointer}
.empty{padding:40px;text-align:center;color:var(--muted)}
/* mini V2pn window */
.win{border-radius:12px;overflow:hidden;border:1px solid #cfd2db;background:#F3F4F7;box-shadow:0 18px 40px -20px rgba(0,0,0,.35);font-size:12px;width:100%;max-width:520px}
.win .tb{display:flex;align-items:center;gap:6px;height:34px;padding:0 10px;background:#fff;border-bottom:1px solid #e3e5eb}
.win .tab{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:7px;color:#666}
.win .tab.on{background:#EEF0F4;color:#111;font-weight:500}
.win .mk{width:14px;height:14px;border-radius:4px;display:grid;place-items:center;color:#fff;font-size:9px;font-weight:700}
.win .body{display:grid;grid-template-columns:42% 1fr;min-height:250px}
.win .list{background:#fff;margin:8px;border-radius:9px;padding:8px;display:flex;flex-direction:column;gap:6px}
.win .plan{border-radius:8px;padding:8px;background:var(--soft)}
.win .bar{height:4px;border-radius:2px;background:#e3e5eb;margin:6px 0 4px;overflow:hidden}
.win .bar i{display:block;height:100%;width:24%}
.win .srv{display:flex;justify-content:space-between;padding:4px 2px;color:#333}
.win .srv b{font-weight:500;color:var(--ok);font-size:11px}
.win .stage{margin:8px 8px 8px 0;border-radius:9px;background:#E6EBE7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;position:relative;overflow:hidden}
.win .stage .st{font-size:11px;color:var(--ok);background:#fff;border-radius:999px;padding:2px 8px}
.win .stage .cty{font-size:16px;font-weight:600}
.win .connect{border:0;border-radius:999px;padding:9px 28px;font-weight:600;font-size:12px;color:#fff}
.win .acts{display:flex;gap:6px}
.win .acts span{background:#fff;border-radius:999px;padding:3px 9px;font-size:10.5px}
/* phone */
.phone{width:320px;border-radius:34px;border:10px solid #16161B;background:#fff;overflow:hidden;min-height:560px;display:flex;flex-direction:column}
.phone .ph-top{height:26px;background:#16161B}
.phone .bot{padding:14px;display:flex;flex-direction:column;gap:10px;background:#E8EEF5;flex:1}
.bubble{background:#fff;border-radius:14px;padding:10px 12px;font-size:13px;max-width:92%}
.tgbtn{display:block;text-align:center;background:#fff;border-radius:10px;padding:9px;font-size:13px;color:#2B7BC0;font-weight:500;border:0;cursor:pointer;width:100%}
.flow{display:grid;grid-template-columns:320px 1fr;gap:36px;align-items:start}
.arrowlist{counter-reset:s;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
.arrowlist li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px}
.arrowlist li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#16161B;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
@media (max-width:900px){.grid3,.grid2,.layout,.flow{grid-template-columns:1fr}h1{font-size:34px}.nav .links{display:none}}
</style>
</head>
<body>
<div class="pbar">
  <b>Прототип</b>
  <span>Смотреть как:</span>
  <div class="seg" role="group" aria-label="Роль">
    <button data-role="provider" aria-pressed="true">Провайдер</button>
    <button data-role="admin" aria-pressed="false">Вы (владелец)</button>
    <button data-role="sub" aria-pressed="false">Подписчик провайдера</button>
  </div>
  <span class="hint" id="hint"></span>
  <button class="reset" id="reset">Сначала</button>
</div>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
const FORK = '<svg class="fork" viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h5l4 6 4-6h5l-7 10v8h-4v-8z"/></svg>';
const S0 = () => ({
  role: 'provider',
  page: 'landing',          // landing | signup | code | apply | check | waiting | cabinet
  email: '', name: 'Kestrel', domains: 'sub.kestrel.example', sub: 'https://sub.kestrel.example/s/9f2c…', contact: '@kestrel_support', want: '1',
  checked: false,
  app: 'none',              // none | pending | approved | rejected
  tier: 0,                  // given by the owner
  cab: 'overview',
  look: { c1: '#2E6BFF', c2: '#7AA8FF', scene: false, logo: true },
  pub: 'none',              // none | pending | live
  api: 'https://kestrel.example/v2pn/api/', apiChecked: false, tier2ask: false,
  installed: true, subStep: 0
});
let S = load();
function load(){ try { return Object.assign(S0(), JSON.parse(localStorage.getItem('proto-provider') || '{}')); } catch { return S0(); } }
function save(){ try { localStorage.setItem('proto-provider', JSON.stringify(S)); } catch {} }
function set(p){ const jump = ['page','role','cab','subStep'].some(k => k in p && p[k] !== S[k]); Object.assign(S, p); save(); render(); if (jump) window.scrollTo({top:0}); }
function toast(t){ const el = document.getElementById('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 1800); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tierName = t => ['Подписка','Проверенный','Интеграция'][t];
const id = () => (S.name || 'provider').toLowerCase().replace(/[^a-z0-9]+/g,'-');

function nav(right){ return `<div class="nav"><div class="logo">${FORK}V2pn</div><div class="links"><span>Возможности</span><span>Установка</span><span style="color:var(--ink)">Провайдерам</span><span>Руководство</span></div><div class="me">${right || ''}</div></div>`; }

function win({branded, scene, tabs = true}){
  const c1 = S.look.c1, c2 = S.look.c2;
  const mk = `<span class="mk" style="background:${c1}">${esc((S.name||'K')[0])}</span>`;
  return `<div class="win">
    <div class="tb">${FORK.replace('fork','fork" style="width:14px;height:14px')}
      ${tabs ? `<span class="tab ${branded?'':'on'}">V2pn</span><span class="tab ${branded?'on':''}">${mk}${esc(S.name)}</span>` : `<span class="tab on">V2pn</span>`}
    </div>
    <div class="body">
      <div class="list">
        <div class="plan" ${branded ? `style="background:${c1}14"` : ''}>
          <div style="display:flex;gap:6px;align-items:center;font-weight:500">${branded && S.look.logo ? mk : ''}${esc(S.name)}</div>
          <div class="bar"><i style="background:${branded ? c1 : '#9aa0ad'}"></i></div>
          <div class="muted" style="font-size:10.5px">12 из 50 ГБ · до 31.01.2027</div>
          ${branded ? `<div style="font-size:10.5px;margin-top:4px;color:${c1};font-weight:500">Продлить · Поддержка</div>` : `<div style="font-size:10.5px;margin-top:4px" class="muted">Поддержка</div>`}
        </div>
        <div class="srv"><span>🇩🇪 Германия</span><b>41 мс</b></div>
        <div class="srv"><span>🇳🇱 Нидерланды</span><b>48 мс</b></div>
        <div class="srv"><span>🇫🇮 Финляндия</span><b>52 мс</b></div>
      </div>
      <div class="stage" style="${scene && branded ? `background:linear-gradient(135deg,${c1},${c2});` : ''}">
        <span class="st">Защищено</span>
        <span class="cty" style="${scene && branded ? 'color:#fff' : ''}">Германия</span>
        <button class="connect" style="${scene && branded ? `background:#fff;color:${c1}` : `background:${branded ? c1 : '#16161B'}`}">Отключиться</button>
        ${branded && S.tier >= 2 ? `<div class="acts"><span>Самый быстрый</span><span>Для YouTube</span></div>` : ''}
      </div>
    </div>
  </div>`;
}

/* ---------------- provider ---------------- */
function provider(){
  const me = S.email ? esc(S.email) : `<button class="btn sm ghost" data-go="signup">Войти</button>`;
  switch (S.page){
  case 'landing': return nav(me) + `
    <h1>Ваша подписка в V2pn</h1>
    <p class="muted" style="max-width:640px;font-size:17px">V2pn — бесплатный VPN-клиент для Windows и macOS. Ваши клиенты вставляют ссылку на подписку, и всё работает. Если хотите своё оформление и вход из бота, подайте заявку.</p>
    <div class="row" style="margin:22px 0 40px"><button class="btn" data-go="${S.email ? 'apply' : 'signup'}">Подать заявку</button><span class="muted small">Бесплатно. Рассмотрение — 1–2 дня.</span></div>
    <div class="grid3">
      <div class="card tier"><span class="n">Ступень 0</span><h3>Подписка</h3><p class="muted small">Ничего делать не нужно.</p>
        <ul><li>Ссылка работает в V2pn как есть</li><li>Название, трафик, срок и «Поддержка» — из заголовков, которые вы уже отдаёте для Happ и Hiddify</li></ul>
        <div class="need">Нужно: <b>ничего</b></div></div>
      <div class="card tier" style="border-color:var(--ink)"><span class="n">Ступень 1</span><h3>Проверенный</h3><p class="muted small">Своя вкладка в V2pn.</p>
        <ul><li>Вкладка с вашим логотипом и цветами</li><li>Страница v2pn.angleford.co/p/вы</li><li>Кнопка «Подключить в V2pn» для бота</li></ul>
        <div class="need">Нужно: <b>заявка</b>. Без программирования.</div></div>
      <div class="card tier"><span class="n">Ступень 2</span><h3>Интеграция</h3><p class="muted small">V2pn говорит с вашим ботом.</p>
        <ul><li>Вход по коду из бота, без ссылок</li><li>Свои кнопки: «Продлить», «Для YouTube»</li><li>Свои правила маршрутизации, скрытые адреса</li></ul>
        <div class="need">Нужно: <b>два адреса API</b> на вашем сервере</div></div>
    </div>`;

  case 'signup': return nav() + `
    <div style="max-width:420px;margin:40px auto 0" class="card">
      <h2>Вход для провайдеров</h2>
      <p class="muted">Пришлём код на почту. Пароль не нужен.</p>
      <label class="field"><span>Почта</span><input type="email" id="email" placeholder="you@kestrel.example" value="${esc(S.email)}"></label>
      <button class="btn" id="sendcode" style="width:100%;justify-content:center">Получить код</button>
    </div>`;

  case 'code': return nav() + `
    <div style="max-width:420px;margin:40px auto 0" class="card">
      <h2>Код из письма</h2>
      <p class="muted">Отправили на ${esc(S.email || 'вашу почту')}. В прототипе подойдёт любой.</p>
      <label class="field"><span>Код</span><input type="text" id="code" inputmode="numeric" placeholder="6 цифр" value="482913"></label>
      <button class="btn" data-go="apply" style="width:100%;justify-content:center">Войти</button>
    </div>`;

  case 'apply': return nav(me) + stepsBar(1) + `
    <div class="grid2">
      <div>
        <h2>Заявка</h2>
        <p class="muted">Пять полей. Тестовую ссылку сайт проверит сразу, до рассмотрения.</p>
        <label class="field"><span>Название</span><input type="text" id="f-name" value="${esc(S.name)}"></label>
        <label class="field"><span>Домены подписки</span><textarea id="f-dom">${esc(S.domains)}</textarea><small>По ним V2pn узнаёт ваши подписки. По одному в строке.</small></label>
        <label class="field"><span>Тестовая ссылка на подписку</span><input type="text" id="f-sub" value="${esc(S.sub)}"><small>Рабочая ссылка на пробный аккаунт. Её видите только вы и владелец V2pn.</small></label>
        <label class="field"><span>Контакт для связи</span><input type="text" id="f-contact" value="${esc(S.contact)}"></label>
        <div class="field"><span>Что хотите</span>
          <div class="radio">
            <label><input type="radio" name="want" value="1" ${S.want==='1'?'checked':''}><div><b>Проверенный</b><div class="muted small">Своя вкладка, страница и кнопка для бота</div></div></label>
            <label><input type="radio" name="want" value="2" ${S.want==='2'?'checked':''}><div><b>Интеграция</b><div class="muted small">То же плюс вход по коду и свои кнопки. Нужен API.</div></div></label>
          </div></div>
        <button class="btn" id="runcheck">Проверить ссылку</button>
      </div>
      <div><div class="card" style="position:sticky;top:70px"><h3>Как это будет</h3><p class="muted small">Сейчас, без заявки, ваша подписка выглядит в V2pn так:</p>${win({branded:false, tabs:false})}<p class="muted small" style="margin-top:12px">После одобрения у тех, кто пришёл от вас, появится своя вкладка.</p></div></div>
    </div>`;

  case 'check': return nav(me) + stepsBar(2) + `
    <div class="grid2">
      <div>
        <h2>Проверка ссылки</h2>
        <p class="muted">Сайт открыл вашу тестовую ссылку так же, как её откроет V2pn.</p>
        <div class="card"><ul class="checks">
          <li><span class="ic ok">✓</span><div><b>Ссылка открывается</b><div class="muted small">200 OK за 0,4 с</div></div></li>
          <li><span class="ic ok">✓</span><div><b>14 серверов</b><div class="muted small">VLESS Reality — 8, Hysteria2 — 6. Все V2pn понимает.</div></div></li>
          <li><span class="ic ok">✓</span><div><b>Название и трафик</b><div class="muted small"><code>profile-title</code>: Kestrel · <code>subscription-userinfo</code>: 12 из 50 ГБ, до 31.01.2027</div></div></li>
          <li><span class="ic ok">✓</span><div><b>Поддержка</b><div class="muted small"><code>support-url</code>: t.me/kestrel_support</div></div></li>
          <li><span class="ic warn">!</span><div><b>Нет ссылки на кабинет</b><div class="muted small">Добавьте заголовок <code>profile-web-page-url</code> — тогда в V2pn появится «Продлить». Не обязательно.</div></div></li>
          <li><span class="ic ok">✓</span><div><b>Сервера отвечают</b><div class="muted small">Проверили 3 из 14 с нашего сервера: 38–61 мс</div></div></li>
        </ul></div>
        <div class="row" style="margin-top:18px"><button class="btn" id="submit">Отправить заявку</button><button class="btn ghost" data-go="apply">Исправить</button></div>
      </div>
      <div><div class="card"><h3>Так будет у ваших людей</h3><p class="muted small">Вкладка с вашим названием. Цвета и логотип настроите после одобрения.</p>${win({branded:true})}</div></div>
    </div>`;

  case 'waiting': return nav(me) + stepsBar(3) + `
    <div class="card" style="max-width:640px">
      ${S.app === 'rejected' ? `<span class="pill bad">Отклонена</span><h2 style="margin-top:12px">Заявку вернули</h2><p class="muted">Причина: «Тестовая ссылка перестала открываться». Исправьте и отправьте снова.</p><button class="btn" data-go="apply">Исправить заявку</button>`
      : `<span class="pill warn">На рассмотрении</span><h2 style="margin-top:12px">Заявка у владельца V2pn</h2><p class="muted">Обычно 1–2 дня. Ответ придёт на ${esc(S.email || 'почту')}. Пока ждёте, ваша подписка уже работает в V2pn как обычная.</p>
      <p class="small muted" style="margin-top:18px">В прототипе: переключитесь на «Вы (владелец)» вверху и одобрите заявку.</p>`}
    </div>`;

  case 'cabinet': return nav(me) + cabinet();
  }
}
function stepsBar(n){
  const L = ['Вход','Заявка','Проверка','Рассмотрение','Кабинет'];
  return `<div class="steps">${L.map((t,i)=>`<span class="${i===n?'on':i<n?'done':''}">${i<n?'✓ ':''}${t}</span>`).join('')}</div>`;
}

function cabinet(){
  const items = [['overview','Обзор'],['look','Оформление'],['share','Как раздать'],['api','Интеграция', S.tier < 2]];
  const side = `<div class="side">${items.map(([k,t,lock])=>`<button data-cab="${k}" aria-current="${S.cab===k}">${t}${lock?'<span class="lock muted">ступень 2</span>':''}</button>`).join('')}</div>`;
  let main = '';
  if (S.cab === 'overview') main = `
    <h2>${esc(S.name)}</h2>
    <div class="row" style="margin-bottom:20px"><span class="pill ok">Одобрен</span><span class="pill">Ступень ${S.tier}: ${tierName(S.tier)}</span>${S.pub==='live'?'<span class="pill ok">Оформление опубликовано</span>':S.pub==='pending'?'<span class="pill warn">Оформление на проверке</span>':'<span class="pill">Оформление не опубликовано</span>'}</div>
    <div class="grid3">
      <div class="card"><h3>1. Оформление</h3><p class="muted small">Логотип и два цвета. Пять минут.</p><button class="btn sm ${S.pub==='none'?'':'ghost'}" data-cab="look">${S.pub==='none'?'Настроить':'Изменить'}</button></div>
      <div class="card"><h3>2. Кнопка для бота</h3><p class="muted small">Одна ссылка: по ней V2pn ставится и добавляет подписку.</p><button class="btn sm ghost" data-cab="share">Взять ссылку</button></div>
      <div class="card"><h3>3. Вход по коду</h3><p class="muted small">${S.tier>=2?'Два адреса API на вашем сервере.':'Доступно на ступени 2.'}</p><button class="btn sm ghost" data-cab="api">${S.tier>=2?'Подключить':'Подробнее'}</button></div>
    </div>`;
  if (S.cab === 'look') main = `
    <h2>Оформление</h2>
    ${S.pub==='pending'?'<div class="banner warn">На проверке у владельца V2pn. Люди пока видят прошлую версию.</div>':S.pub==='live'?'<div class="banner ok">Опубликовано. V2pn у ваших людей подхватит изменения в течение часа.</div>':''}
    <div class="grid2">
      <div>
        <div class="field"><span>Логотип</span><div class="row"><span class="mk" style="width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;background:${S.look.c1}">${esc(S.name[0])}</span><button class="btn sm ghost" id="logo">Загрузить PNG или SVG</button></div><small>Квадрат от 256 px. Светлый и тёмный варианты — по желанию.</small></div>
        <div class="field"><span>Цвета</span><div class="row">
          <input type="color" class="swatch" id="c1" value="${S.look.c1}"><input type="color" class="swatch" id="c2" value="${S.look.c2}">
          <span class="muted small">Основной — на кнопке «Подключиться». Второй — для фона.</span></div></div>
        <div class="field"><span>Вид</span><div class="radio">
          <label><input type="radio" name="scene" value="0" ${!S.look.scene?'checked':''}><div><b>Акцент</b><div class="muted small">Обычный V2pn с вашим цветом и логотипом</div></div></label>
          <label><input type="radio" name="scene" value="1" ${S.look.scene?'checked':''}><div><b>Сцена</b><div class="muted small">Ваш градиент вместо карты</div></div></label></div></div>
        <div class="banner info small">Контраст текста проверяется сам. Если цвет нечитаем, сайт подскажет и не даст опубликовать.</div>
        <button class="btn" id="publish">${S.pub==='live'?'Опубликовать изменения':'Отправить на публикацию'}</button>
      </div>
      <div style="position:sticky;top:70px;align-self:start">${win({branded:true, scene:S.look.scene})}</div>
    </div>`;
  if (S.cab === 'share') { const link = `https://v2pn.angleford.co/p/${id()}/#sub=<ссылка-подписки-человека>`; main = `
    <h2>Как раздать V2pn своим людям</h2>
    <p class="muted" style="max-width:640px">Добавьте в бота и в кабинет кнопку «💻 Подключить в V2pn». В ссылку подставьте подписку этого человека.</p>
    <div class="field"><span>Ссылка для кнопки</span><div class="copyline"><code>${esc(link)}</code><button class="btn sm ghost" data-copy="${esc(link)}">Копировать</button></div>
      <small>Подписка идёт после <code>#</code> — эта часть не уходит на наш сервер и не попадает в логи.</small></div>
    <div class="grid2" style="margin-top:8px">
      <div class="card"><h3>V2pn уже стоит</h3><ol class="arrowlist small"><li>Человек жмёт кнопку в боте</li><li>Страница открывает V2pn</li><li>V2pn добавляет подписку и вашу вкладку</li></ol></div>
      <div class="card"><h3>V2pn ещё нет</h3><ol class="arrowlist small"><li>Страница предлагает скачать V2pn под его систему</li><li>Человек ставит и жмёт ту же кнопку ещё раз</li><li>Дальше — как слева</li></ol></div>
    </div>
    <p class="muted small" style="margin-top:16px">Ваша страница: <a href="#" data-role-go="sub">v2pn.angleford.co/p/${id()}</a>. Посмотреть глазами подписчика — «Подписчик провайдера» вверху.</p>`; }
  if (S.cab === 'api') main = S.tier < 2 ? `
    <h2>Интеграция</h2>
    <p class="muted" style="max-width:620px">На ступени 2 человек входит в V2pn по коду из вашего бота, без ссылок. Для этого на вашем сервере нужны два адреса. Описание ниже.</p>
    ${S.tier2ask?'<div class="banner warn">Запрос отправлен владельцу V2pn.</div>':'<button class="btn" id="ask2">Запросить ступень 2</button>'}
    <div style="margin-top:22px">${apiDoc()}</div>` : `
    <h2>Интеграция</h2>
    <div class="field" style="max-width:560px"><span>Адрес вашего API</span><input type="text" id="api" value="${esc(S.api)}"></div>
    ${apiDoc()}
    <button class="btn" id="apicheck">Проверить API</button>
    ${S.apiChecked?`<div class="card" style="margin-top:16px"><ul class="checks">
      <li><span class="ic ok">✓</span><div><b>login/start</b> отвечает<div class="muted small">код 6 цифр, ссылка на бота, срок 600 с</div></div></li>
      <li><span class="ic ok">✓</span><div><b>login/poll</b> отвечает «ждём»<div class="muted small">до подтверждения в боте</div></div></li>
      <li><span class="ic wait">…</span><div><b>Подтвердите код в своём боте</b><div class="muted small">Код <code>482913</code>. После подтверждения проверка закончится сама.</div></div></li>
    </ul></div>`:''}`;
  return `<div class="layout">${side}<div>${main}</div></div>`;
}
function apiDoc(){ return `
  <div class="grid2">
    <div><h3>1. Начать вход</h3><p class="muted small">V2pn просит код.</p><pre>POST {api}login/start
→ { "code": "482913",
    "url": "https://t.me/kestrel_bot?start=v2pn-482913",
    "token": "…", "expires": 600 }</pre></div>
    <div><h3>2. Проверить вход</h3><p class="muted small">V2pn спрашивает раз в 2 секунды, пока человек не подтвердит в боте.</p><pre>GET {api}login/poll?token=…
→ { "status": "waiting" }
→ { "status": "done", "subscription": "https://…" }</pre></div>
  </div>`; }

/* ---------------- admin ---------------- */
function admin(){
  const rows = [];
  if (S.app === 'pending') rows.push(`<tr><td><b>${esc(S.name)}</b><div class="muted small">${esc(S.email||'you@kestrel.example')} · ${esc(S.contact)}</div></td>
    <td>Хочет: <b>${tierName(+S.want)}</b><div class="muted small">${esc(S.domains)}</div></td>
    <td><span class="pill ok">14 серверов</span> <span class="pill ok">заголовки</span> <span class="pill warn">нет кабинета</span></td>
    <td><div class="row"><select id="givetier"><option value="1" ${S.want==='1'?'selected':''}>Ступень 1</option><option value="2" ${S.want==='2'?'selected':''}>Ступень 2</option></select><button class="btn sm" id="approve">Одобрить</button><button class="btn sm ghost" id="reject">Отклонить</button></div></td></tr>`);
  const pubs = [];
  if (S.pub === 'pending') pubs.push(`<tr><td><b>${esc(S.name)}</b><div class="muted small">новое оформление</div></td><td style="width:300px">${win({branded:true, scene:S.look.scene})}</td><td><span class="pill ok">контраст в норме</span></td><td><div class="row"><button class="btn sm" id="pubok">Опубликовать</button><button class="btn sm ghost" id="pubno">Вернуть</button></div></td></tr>`);
  if (S.tier2ask && S.tier < 2) pubs.push(`<tr><td><b>${esc(S.name)}</b><div class="muted small">просит ступень 2</div></td><td colspan="2" class="muted small">Сейчас ступень 1</td><td><button class="btn sm" id="give2">Дать ступень 2</button></td></tr>`);
  const live = S.app === 'approved' ? `<tr><td><b>${esc(S.name)}</b></td><td>Ступень ${S.tier}: ${tierName(S.tier)}</td><td>${S.pub==='live'?'<span class="pill ok">оформление опубликовано</span>':'<span class="pill">оформление не опубликовано</span>'}</td><td><button class="btn sm ghost" id="revoke">Отозвать</button></td></tr>` : '';
  return nav('Вы · владелец') + `
    <h1 style="font-size:34px">Провайдеры</h1>
    <p class="muted">Здесь всё, что ждёт вашего решения. Подпись и публикация происходят сами после кнопки.</p>
    <h3 style="margin-top:28px">Новые заявки</h3>
    <div class="card" style="padding:6px 12px">${rows.length?`<table><tr><th>Провайдер</th><th>Запрос</th><th>Автопроверка</th><th>Решение</th></tr>${rows.join('')}</table>`:`<div class="empty">Новых заявок нет${S.app==='none'?'. Подайте заявку от имени провайдера, чтобы увидеть её здесь.':''}</div>`}</div>
    <h3 style="margin-top:28px">Ждут публикации</h3>
    <div class="card" style="padding:6px 12px">${pubs.length?`<table><tr><th>Провайдер</th><th>Как выглядит</th><th>Проверка</th><th>Решение</th></tr>${pubs.join('')}</table>`:'<div class="empty">Ничего не ждёт</div>'}</div>
    <h3 style="margin-top:28px">Партнёры</h3>
    <div class="card" style="padding:6px 12px"><table><tr><th>Провайдер</th><th>Ступень</th><th>Оформление</th><th></th></tr>
      <tr><td><b>Configra</b></td><td>Ступень 2: Интеграция</td><td><span class="pill ok">оформление опубликовано</span></td><td><button class="btn sm ghost" disabled>Отозвать</button></td></tr>${live}</table></div>`;
}

/* ---------------- subscriber ---------------- */
function sub(){
  const ok = S.app === 'approved';
  const c1 = S.look.c1;
  const steps = [
    `<div class="bubble">Ваша подписка Kestrel активна до 31.01.2027.</div><button class="tgbtn" id="tg">💻 Подключить в V2pn</button><button class="tgbtn" disabled>📱 Подключить в Happ</button>`,
  ];
  let right = '';
  if (!ok) right = `<div class="banner warn">Провайдер ещё не одобрен. Без одобрения его ссылка работает в V2pn как обычная подписка: вставил ссылку — подключился, без вкладки.</div>`;
  if (S.subStep === 0) right += `<h2>Человек в боте провайдера</h2><p class="muted">Жмёт «Подключить в V2pn».</p>
    <label class="row small" style="margin-top:14px"><input type="checkbox" id="inst" ${S.installed?'checked':''}> У человека уже стоит V2pn</label>`;
  if (S.subStep === 1) right += S.installed ? `
    <h2>Открылась страница провайдера</h2>
    <p class="muted">v2pn.angleford.co/p/${id()} — на долю секунды, браузер спрашивает «Открыть V2pn?».</p>
    <button class="btn" id="open">Открыть V2pn</button>` : `
    <div class="card" style="max-width:520px;${ok?`background:linear-gradient(135deg,${c1},${S.look.c2});color:#fff;border:0`:''}">
      <h2>${esc(S.name)} на компьютере</h2>
      <p style="opacity:.85">Поставьте V2pn — бесплатный клиент для Windows и macOS. Потом нажмите кнопку ещё раз.</p>
      <div class="row"><button class="btn dark" id="dl">Скачать для Windows</button><span class="small" style="opacity:.8">macOS · ARM</span></div>
    </div>`;
  if (S.subStep === 2) right += `
    <h2>Готово</h2>
    <p class="muted">${ok?'V2pn добавил подписку и вкладку провайдера. Вкладка V2pn рядом — обычный V2pn, без чужого оформления.':'V2pn добавил подписку. Вкладки нет: провайдер не одобрен.'}</p>
    ${win({branded:ok, scene:S.look.scene && S.pub==='live', tabs:ok})}
    ${ok && S.pub!=='live'?'<p class="muted small" style="margin-top:10px">Цвета пока стандартные: провайдер ещё не опубликовал оформление.</p>':''}
    <button class="btn ghost sm" id="again" style="margin-top:16px">Ещё раз</button>`;
  return `<div style="height:40px"></div><div class="flow"><div class="phone"><div class="ph-top"></div><div class="bot">${steps[0]}</div></div><div>${right}</div></div>`;
}

/* ---------------- render ---------------- */
function render(){
  document.querySelectorAll('[data-role]').forEach(b => b.setAttribute('aria-pressed', b.dataset.role === S.role));
  const H = {provider:'Подайте заявку, как это сделает провайдер', admin:'Решения, которые ждут вас', sub:'Что видит человек из бота провайдера'};
  document.getElementById('hint').textContent = H[S.role];
  const app = document.getElementById('app');
  app.innerHTML = `<div class="site">${S.role==='provider'?provider():S.role==='admin'?admin():sub()}</div>`;
  bind();
}
function val(id){ const e = document.getElementById(id); return e ? e.value : ''; }
function bind(){
  const on = (id, f) => { const e = document.getElementById(id); if (e) e.addEventListener('click', f); };
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => set({page: b.dataset.go}));
  document.querySelectorAll('[data-cab]').forEach(b => b.onclick = () => set({cab: b.dataset.cab}));
  document.querySelectorAll('[data-role-go]').forEach(b => b.onclick = e => { e.preventDefault(); set({role: b.dataset.roleGo, subStep: 0}); });
  document.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => { try { navigator.clipboard.writeText(b.dataset.copy); } catch {} toast('Скопировано'); });
  on('sendcode', () => set({email: val('email') || 'you@kestrel.example', page: 'code'}));
  on('runcheck', () => { const w = document.querySelector('input[name=want]:checked'); set({name: val('f-name') || 'Kestrel', domains: val('f-dom'), sub: val('f-sub'), contact: val('f-contact'), want: w ? w.value : '1', page: 'check'}); });
  on('submit', () => { set({app: 'pending', page: 'waiting'}); toast('Заявка отправлена'); });
  on('approve', () => { set({app: 'approved', tier: +val('givetier'), page: 'cabinet', cab: 'overview'}); toast('Одобрено. Провайдеру ушло письмо'); });
  on('reject', () => { set({app: 'rejected', page: 'waiting'}); toast('Отклонено с причиной'); });
  on('publish', () => { set({pub: 'pending'}); toast('Отправлено владельцу V2pn'); });
  on('pubok', () => { set({pub: 'live'}); toast('Подписано и опубликовано'); });
  on('pubno', () => { set({pub: 'none'}); toast('Возвращено провайдеру'); });
  on('give2', () => { set({tier: 2}); toast('Ступень 2 выдана'); });
  on('revoke', () => { set({app: 'none', tier: 0, pub: 'none', page: 'landing'}); toast('Отозвано: вкладка пропадёт у людей при следующем обновлении'); });
  on('ask2', () => { set({tier2ask: true}); toast('Запрос отправлен'); });
  on('apicheck', () => set({api: val('api'), apiChecked: true}));
  on('logo', () => toast('В прототипе логотип — первая буква названия'));
  on('tg', () => set({subStep: 1}));
  on('open', () => set({subStep: 2}));
  on('dl', () => { set({installed: true, subStep: 0}); toast('V2pn установлен. Теперь кнопка ещё раз'); });
  on('again', () => set({subStep: 0}));
  const inst = document.getElementById('inst'); if (inst) inst.onchange = () => set({installed: inst.checked});
  const c1 = document.getElementById('c1'), c2 = document.getElementById('c2');
  if (c1) c1.onchange = () => set({look: {...S.look, c1: c1.value}});
  if (c2) c2.onchange = () => set({look: {...S.look, c2: c2.value}});
  document.querySelectorAll('input[name=scene]').forEach(r => r.onchange = () => set({look: {...S.look, scene: r.value === '1'}}));
}
document.querySelectorAll('[data-role]').forEach(b => b.onclick = () => set({role: b.dataset.role, subStep: 0}));
document.getElementById('reset').onclick = () => { S = S0(); save(); render(); };
render();
</script>
</body>
</html>
